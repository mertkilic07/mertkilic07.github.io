<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" fill="none">
  <defs>
    <linearGradient id="lr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="rf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="baseline_g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ef4444" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="200" y="22" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" font-weight="700" fill="#e2e8f0" letter-spacing="1">MODEL PERFORMANCE</text>

  <!-- Axes -->
  <line x1="72" y1="30" x2="72" y2="210" stroke="#334155" stroke-width="1.5"/>
  <line x1="72" y1="210" x2="370" y2="210" stroke="#334155" stroke-width="1.5"/>

  <!-- Y gridlines + labels -->
  <line x1="72" y1="210" x2="370" y2="210" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="72" y1="174" x2="370" y2="174" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="72" y1="138" x2="370" y2="138" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="72" y1="102" x2="370" y2="102" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="72" y1="66"  x2="370" y2="66"  stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="72" y1="30"  x2="370" y2="30"  stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4"/>

  <text x="65" y="213" text-anchor="end" font-family="Inter,sans-serif" font-size="8" fill="#64748b">0.0</text>
  <text x="65" y="177" text-anchor="end" font-family="Inter,sans-serif" font-size="8" fill="#64748b">0.2</text>
  <text x="65" y="141" text-anchor="end" font-family="Inter,sans-serif" font-size="8" fill="#64748b">0.4</text>
  <text x="65" y="105" text-anchor="end" font-family="Inter,sans-serif" font-size="8" fill="#64748b">0.6</text>
  <text x="65" y="69"  text-anchor="end" font-family="Inter,sans-serif" font-size="8" fill="#64748b">0.8</text>
  <text x="65" y="33"  text-anchor="end" font-family="Inter,sans-serif" font-size="8" fill="#64748b">1.0</text>

  <!-- Baseline 0.5 -->
  <line x1="72" y1="120" x2="370" y2="120" stroke="url(#baseline_g)" stroke-width="1.5"/>
  <text x="374" y="123" font-family="Inter,sans-serif" font-size="7.5" fill="#ef4444" opacity="0.8">0.5</text>

  <!-- Group labels -->
  <text x="120" y="228" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" font-weight="600" fill="#94a3b8">Accuracy</text>
  <text x="190" y="228" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" font-weight="600" fill="#94a3b8">Precision</text>
  <text x="260" y="228" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" font-weight="600" fill="#94a3b8">Recall</text>
  <text x="330" y="228" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" font-weight="600" fill="#94a3b8">F1-Score</text>

  <!-- Accuracy: LR=0.489 → height=107, RF=0.525 → height=115 -->
  <!-- bar height = value * 180, y = 210 - height -->
  <!-- LR bars (purple) -->
  <rect x="92"  y="122" width="20" height="88" rx="3" fill="url(#lr)"/>   <!-- 0.489 -->
  <rect x="162" y="128" width="20" height="82" rx="3" fill="url(#lr)"/>   <!-- 0.457 -->
  <rect x="232" y="121" width="20" height="89" rx="3" fill="url(#lr)"/>   <!-- 0.492 -->
  <rect x="302" y="125" width="20" height="85" rx="3" fill="url(#lr)"/>   <!-- 0.474 -->

  <!-- RF bars (green) -->
  <rect x="116" y="116" width="20" height="94" rx="3" fill="url(#rf)"/>   <!-- 0.525 -->
  <rect x="186" y="122" width="20" height="88" rx="3" fill="url(#rf)"/>   <!-- 0.488 -->
  <rect x="256" y="155" width="20" height="55" rx="3" fill="url(#rf)"/>   <!-- 0.308 -->
  <rect x="326" y="143" width="20" height="67" rx="3" fill="url(#rf)"/>   <!-- 0.377 -->

  <!-- Value labels on bars -->
  <text x="102" y="118" text-anchor="middle" font-family="Inter,sans-serif" font-size="7" font-weight="700" fill="#818cf8">.49</text>
  <text x="126" y="112" text-anchor="middle" font-family="Inter,sans-serif" font-size="7" font-weight="700" fill="#34d399">.53</text>
  <text x="172" y="124" text-anchor="middle" font-family="Inter,sans-serif" font-size="7" font-weight="700" fill="#818cf8">.46</text>
  <text x="196" y="118" text-anchor="middle" font-family="Inter,sans-serif" font-size="7" font-weight="700" fill="#34d399">.49</text>
  <text x="242" y="117" text-anchor="middle" font-family="Inter,sans-serif" font-size="7" font-weight="700" fill="#818cf8">.49</text>
  <text x="266" y="151" text-anchor="middle" font-family="Inter,sans-serif" font-size="7" font-weight="700" fill="#34d399">.31</text>
  <text x="312" y="121" text-anchor="middle" font-family="Inter,sans-serif" font-size="7" font-weight="700" fill="#818cf8">.47</text>
  <text x="336" y="139" text-anchor="middle" font-family="Inter,sans-serif" font-size="7" font-weight="700" fill="#34d399">.38</text>

  <!-- Legend -->
  <rect x="130" y="242" width="10" height="10" rx="2" fill="url(#lr)"/>
  <text x="144" y="251" font-family="Inter,sans-serif" font-size="9" fill="#94a3b8">Logistic Regression</text>
  <rect x="240" y="242" width="10" height="10" rx="2" fill="url(#rf)"/>
  <text x="254" y="251" font-family="Inter,sans-serif" font-size="9" fill="#94a3b8">Random Forest</text>
</svg>
