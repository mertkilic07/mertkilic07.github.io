<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" fill="none">
  <!-- Window frame -->
  <rect x="10" y="10" width="380" height="240" rx="10" fill="#1e2430" stroke="#334155" stroke-width="1.2"/>
  <!-- Title bar -->
  <rect x="10" y="10" width="380" height="28" rx="10" fill="#252d3d"/>
  <rect x="10" y="28" width="380" height="10" fill="#252d3d"/>
  <!-- Traffic lights -->
  <circle cx="28" cy="24" r="5" fill="#ff5f57"/>
  <circle cx="44" cy="24" r="5" fill="#febc2e"/>
  <circle cx="60" cy="24" r="5" fill="#28c840"/>
  <text x="200" y="27" text-anchor="middle" font-family="Inter,sans-serif" font-size="9.5" font-weight="600" fill="#94a3b8">Quiz Game — Client</text>

  <!-- Connection bar -->
  <rect x="18" y="46" width="364" height="30" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="26" y="57" font-family="Inter,sans-serif" font-size="7.5" fill="#64748b">IP</text>
  <rect x="38" y="49" width="54" height="14" rx="3" fill="#1e293b"/>
  <text x="65" y="59" text-anchor="middle" font-family="Inter,sans-serif" font-size="7" fill="#94a3b8">127.0.0.1</text>
  <text x="98" y="57" font-family="Inter,sans-serif" font-size="7.5" fill="#64748b">Port</text>
  <rect x="112" y="49" width="32" height="14" rx="3" fill="#1e293b"/>
  <text x="128" y="59" text-anchor="middle" font-family="Inter,sans-serif" font-size="7" fill="#94a3b8">5001</text>
  <text x="150" y="57" font-family="Inter,sans-serif" font-size="7.5" fill="#64748b">User</text>
  <rect x="164" y="49" width="54" height="14" rx="3" fill="#1e293b"/>
  <text x="191" y="59" text-anchor="middle" font-family="Inter,sans-serif" font-size="7" fill="#60a5fa">mert</text>
  <rect x="226" y="49" width="46" height="14" rx="3" fill="#3b82f6"/>
  <text x="249" y="59" text-anchor="middle" font-family="Inter,sans-serif" font-size="7.5" font-weight="700" fill="#fff">Connect</text>

  <!-- Live Scores -->
  <rect x="18" y="82" width="364" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="24" y="91" font-family="Inter,sans-serif" font-size="7" fill="#64748b" font-weight="600">LIVE SCORES</text>
  <text x="24" y="100" font-family="Inter,sans-serif" font-size="7.5" fill="#60a5fa">mert: 3 pts</text>
  <text x="100" y="100" font-family="Inter,sans-serif" font-size="7.5" fill="#94a3b8">alex: 2 pts</text>
  <text x="166" y="100" font-family="Inter,sans-serif" font-size="7.5" fill="#94a3b8">sara: 1 pt</text>

  <!-- Question box -->
  <rect x="18" y="110" width="364" height="100" rx="6" fill="#0f172a" stroke="#1e3a5f" stroke-width="1.2"/>
  <text x="24" y="122" font-family="Inter,sans-serif" font-size="7.5" font-weight="700" fill="#60a5fa">QUESTION 3 / 5</text>
  <text x="24" y="136" font-family="Inter,sans-serif" font-size="9" font-weight="600" fill="#e2e8f0">What does TCP stand for?</text>

  <!-- Radio A - selected -->
  <circle cx="32" cy="152" r="5" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="32" cy="152" r="2.5" fill="#3b82f6"/>
  <text x="42" y="156" font-family="Inter,sans-serif" font-size="8" fill="#e2e8f0">A — Transmission Control Protocol</text>

  <!-- Radio B -->
  <circle cx="32" cy="168" r="5" fill="none" stroke="#475569" stroke-width="1.5"/>
  <text x="42" y="172" font-family="Inter,sans-serif" font-size="8" fill="#64748b">B — Transfer Communication Protocol</text>

  <!-- Radio C -->
  <circle cx="32" cy="184" r="5" fill="none" stroke="#475569" stroke-width="1.5"/>
  <text x="42" y="188" font-family="Inter,sans-serif" font-size="8" fill="#64748b">C — Timed Connection Protocol</text>

  <!-- Submit button -->
  <rect x="300" y="195" width="74" height="18" rx="4" fill="#3b82f6"/>
  <text x="337" y="207" text-anchor="middle" font-family="Inter,sans-serif" font-size="8" font-weight="700" fill="#fff">Submit Answer</text>

  <!-- Activity log -->
  <rect x="18" y="217" width="364" height="26" rx="4" fill="#080d14" stroke="#1e293b" stroke-width="1"/>
  <text x="24" y="227" font-family="Inter,sans-serif" font-size="7" fill="#334155">[10:42:01] Connected to server</text>
  <text x="24" y="238" font-family="Inter,sans-serif" font-size="7" fill="#334155">[10:42:45] Question 3 received</text>
</svg>
